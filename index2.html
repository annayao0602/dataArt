<!DOCTYPE html>
<html>

<meta charset="utf-8">
<head>
    <title>D3 Research Visualization</title>
    <link href='https://fonts.googleapis.com/css?family=Jura' rel='stylesheet'>
    <link rel="stylesheet" href="stylesheet.css">

    <script src="https://d3js.org/d3.v4.js"></script>
    <script src="circos_simple.js"></script>

</head>
<style>
    body {
        font-family: 'Jura';
    }
    .controls_1 {
        font-family: 'Jura';
        display: flex;
        flex-direction: column;
    }
    .container_circos {
        display: flex;
        flex-direction: row;
        justify-content: space-between;
        align-items: flex-start;
        position: sticky;
        top: 0;
    }
    .viz_container {
        display: flex;
        flex-direction: row;
        height: 80vh;
    }
</style>

<body>
<div class = "main_page">
    <div class = "container_circos">
        <div class = controls_1>
            <div id = "line1">
                <label for="dataset-select" style = 'font-family: Jura;'>Choose a university:</label>
                <select id="dataset-select">
                    <option value="https://raw.githubusercontent.com/annayao0602/dataArt/refs/heads/main/uva_full_hierarchy.csv">UVA</option>
                </select>
            </div>
            <div class = "checkbox">
                <label for = "toggle-axes" style = 'font-family: Jura;'>Axes lines</label>
                <input type="checkbox" 
                    name="check" 
                    id="toggle-axes" checked>
            </div>
        </div>
    </div>
    <div class = "viz_container">
        <div id = my_dataviz></div>
    </div>
</div>



<script src = "main_circos2.js"></script>


</body>
</html>
